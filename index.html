<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mes Recettes de Pâtisserie</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <a href="index.html" class="brand">Mes Recettes</a>
  <nav class="header-actions">
    <button id="export-btn" class="btn-secondary" type="button">Exporter</button>
    <label class="btn-secondary file-label">
      Importer
      <input type="file" id="import-input" accept="application/json" hidden />
    </label>
    <a href="edit.html" class="btn-primary">+ Nouvelle recette</a>
  </nav>
</header>

<main class="container">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Rechercher une recette…" aria-label="Rechercher une recette" />
    <select id="category-filter" aria-label="Filtrer par catégorie"></select>
  </div>
  <div id="recipe-grid" class="recipe-grid"></div>
</main>

<script src="js/storage.js"></script>
<script src="js/list.js"></script>
</body>
</html>
